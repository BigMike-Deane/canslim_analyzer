# Prometheus scrape config for the CANSLIM box.
#
# Scope is deliberately narrow: cAdvisor only. The point of this stack is a
# per-container memory series that SURVIVES a canslim redeploy -- the Sep-8
# OOM went unnoticed for 91h, and every deploy used to wipe the in-process
# RSS samples that backend/process_health.py keeps in Redis, so a leak-rate
# read had to restart from zero each time. Prometheus stores the series
# outside the app container, so restarts no longer cost us the history.
#
# Keep cardinality low on purpose: this is a 3.8 GB box and Prometheus RAM
# scales with active series. No node_exporter, no app metrics yet.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Delivery (2026-09-10): without this, the rules above fired into nothing.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Drop the long tail we will never query. cAdvisor emits thousands of
      # per-cpu / per-filesystem series per container; on this box that is
      # the difference between ~100 MB and ~500 MB of Prometheus RSS.
      - source_labels: [__name__]
        regex: 'container_(memory_(usage_bytes|working_set_bytes|max_usage_bytes|failcnt)|cpu_usage_seconds_total|last_seen|start_time_seconds|spec_memory_limit_bytes|network_(receive|transmit)_bytes_total)'
        action: keep
      - source_labels: [name]
        regex: '.+'
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
