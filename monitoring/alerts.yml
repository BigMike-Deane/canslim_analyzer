# Alerting rules. These replace log-grepping for the failure modes that
# actually bit us.
groups:
  - name: canslim-memory
    rules:
      # The Sep-8 incident: uvicorn grew to 2.87 GB over 91h and the kernel
      # OOM-killed it host-wide. mem_limit=2560m now contains the blast
      # radius, so this fires well before the cap.
      - alert: CanslimMemoryHigh
        expr: container_memory_working_set_bytes{name="canslim-analyzer"} > 1800e6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "canslim-analyzer working set above 1800 MB"
          description: "Working set {{ $value | humanize1024 }}B against a 2560 MB cap. Check the leak hunt before it gets OOM-killed."

      # Catches a leak EARLY: sustained growth regardless of absolute level.
      # 15 MB/h over 6h is well above the ~23 MB/h steady rate measured on
      # 2026-09-08/09, so this is a "getting worse than baseline" signal.
      - alert: CanslimMemoryClimbing
        expr: deriv(container_memory_working_set_bytes{name="canslim-analyzer"}[6h]) * 3600 > 40e6
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "canslim-analyzer memory climbing faster than baseline"
          description: "Growing at {{ $value | humanize }}B/h; the measured no-cap baseline was ~23 MB/h."

      - alert: CanslimContainerGone
        expr: absent(container_last_seen{name="canslim-analyzer"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "canslim-analyzer not reporting to cAdvisor"
          description: "Container missing for 5m -- crashed, OOM-killed, or stopped."

      # The leak FUSE (2026-09-10). The residual leak (~13 MB/h after the
      # arena cap) is below CanslimMemoryClimbing's 40 MB/h bar, so that rule
      # never fires on it -- but at that rate the container still walks into
      # its cap in days. Projects the last 6h forward 24h against the cap --
      # only once the container is 8h+ up: the post-restart warm-up climbs
      # ~130 MB/h for its first hours and would trip this after every deploy.
      - alert: CanslimMemoryWillHitCap
        expr: >-
          predict_linear(max by (name) (container_memory_working_set_bytes{name="canslim-analyzer"})[6h:5m], 24 * 3600)
          > 2560e6
          and on (name)
          (time() - max by (name) (container_start_time_seconds{name="canslim-analyzer"})) > 8 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "canslim-analyzer projected to hit its 2560 MB cap within 24h"
          description: "At the last 6h trend. Plan a restart (after the close) or chase the leak."

      - alert: PostgresGone
        expr: absent(container_last_seen{name="canslim-postgres"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "canslim-postgres not reporting to cAdvisor"
          description: "Database container missing for 5m -- the app cannot trade or record."

      - alert: RedisGone
        expr: absent(container_last_seen{name="canslim-redis"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "canslim-redis not reporting to cAdvisor"
          description: "Cache container missing for 10m -- the app degrades to DB/API fetches."

      - alert: HostMemoryLow
        expr: sum(container_memory_working_set_bytes{name=~".+"}) > 3200e6
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Containers collectively above 3200 MB on a 3806 MB host"
          description: "This is how the Sep-8 host-wide OOM kill happened."
