# Shadow Paper-Trading Stacks
# Forward-only candidate scoring stacks evaluated against the live baseline.
# See docs/shadow-paper-trading-design.md for the full design.
#
# Provisioning model (Step 4 of the harness):
#   - Edit this section, push, and on next scheduler boot the entries here are
#     reconciled against the shadow_strategies table:
#       * names not in DB are INSERTED (config_snapshot frozen from current YAML)
#       * names in DB get mutable fields (description, scorer_overrides,
#         starting_value) updated; config_snapshot/parent_strategy are immutable
#       * names removed from YAML are SOFT-ARCHIVED (archived_at = now); their
#         shadow_trades rows are preserved for backfill reads
#       * removed-then-re-added names get a fresh ShadowStrategy row (new id);
#         the previously-archived row stays around for historical reads
#
# Constraints:
#   - parent_strategy MUST match a key in strategy_profiles: above (validated
#     at sync time; bad parent raises ValueError, sync rolls back)
#   - scorer_overrides is consumed by shadow_trader as of Shadow Step 7
#     (May 2026) — see backend/shadow_trader.py _apply_disable_excellence_cap.
#     `disable_excellence_cap: true` substitutes c_score_uncapped for c_score
#     and adjusts canslim_score by the cap delta, giving the shadow run a
#     pre-Approach-2 view. NULL c_score_uncapped (rows scored before Step 7
#     landed) passes through unchanged.
shadow_strategy_profiles:
  shadow_baseline:
    parent_strategy: nostate_cs_bear
    starting_value: 25000
    description: "Forward-only parity check against live cs_bear baseline"
    scorer_overrides: {}
  # shadow_no_excellence_cap ARCHIVED 2026-07-25 (removal here soft-archives
  # the DB row; ShadowTrade history stays attached to id=2). VERDICT: no-op —
  # 2.5 months live (May-9 -> Jul-25), 33 trades, bit-identical to
  # shadow_baseline throughout; disable_excellence_cap never changed a single
  # executed buy. The excellence cap does not affect what actually gets
  # bought. Don't re-test this lever via shadow; a divergence would need a
  # candidate that scores near the cap boundary, which the buy path never
  # surfaces.
  # Chop-damper live A/B (2026-07-22): champion clone + half-size buys while
  # SPY sits 0-1.5% above its 50MA. See docs/real-money-gates.md Gate 2 and
  # the nostate_chop_damper profile. Registered HERE (not direct DB insert —
  # the sync soft-archives any active shadow this section doesn't declare).
  # 2026-07-30: profile rebased onto cs_bear (CZ + ML-veto parity with the
  # baseline); stack reset same day — A/B clock restarts at the reset.
  shadow_chop_damper:
    parent_strategy: nostate_chop_damper
    starting_value: 25000
    description: "Champion + chop damper (half-size buys while SPY hugs its 50MA) — live A/B for the Jul-22 regime-attribution chop bleed"
    scorer_overrides: {}
  # Exit-lab wide-trail A/B (2026-07-24): cs_bear clone with trailing bands
  # x1.5. Promotion criteria pre-registered on the nostate_wide_trail profile
  # comment — paired vs shadow_baseline, >=15 exits, mixed-regime, no early call.
  shadow_wide_trail:
    parent_strategy: nostate_wide_trail
    starting_value: 25000
    description: "cs_bear + trailing bands x1.5 — exit-lab jul-24 candidate (replay +8.2pp/episode pooled across 2018-2026 windows; shadow A/B is the promotion gate)"
    scorer_overrides: {}
  # Big-winner cap A/B (2026-07-29): owner asked whether large gains are held
  # too long. Replay says caps below +40 destroy value (cap_at_30 sig worse)
  # but a 100%-realize at +50 is expectation-neutral and variance-reducing.
  shadow_cap50:
    parent_strategy: nostate_cap50
    starting_value: 25000
    description: "cs_bear + realize 100% at +50% gain — exit-lab jul-29 candidate (replay +0.14pp/episode n.s.; cuts 50+ tail variance; shadow A/B is the promotion gate)"
    scorer_overrides: {}
