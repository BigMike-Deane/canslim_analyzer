# CANSLIM Analyzer Default Configuration
# Override these values in development.yaml or production.yaml

# Email
email:
  # Master switch for AUTOMATED emails (watchlist alerts,
  # weekly performance digest, weekly bear-market report). Disabled May 7
  # 2026 because they had been silently failing on port 465 for who knows
  # how long, and the user prefers on-demand session summaries instead.
  # send_email() itself stays callable for ad-hoc use; this flag only
  # gates the scheduled / event-driven triggers.
  automated_enabled: false

# Scanner Settings
scanner:
  # Insider/short-interest fetching (2026-07-22): OFF by default. The
  # signals were removed from trading (May) and the InsiderSentiment page
  # is retired; the per-cycle fetch fed nothing. Flip true to resume
  # collecting - fetcher and DB columns remain intact.
  fetch_insider_short: false

  # Universe supplement: FMP /stable/company-screener adds actively-trading
  # US-listed names no tracked index covers (recent IPOs, foreign-domiciled
  # listings like ONON/FROG, Russell members the degraded IWM/Finviz sources
  # miss). Measured +1,367 tickers on 2026-07-06. Tighten filters here if
  # scan-cycle freshness degrades — no redeploy needed.
  universe:
    # Alert (log + webhook) when the universe shrinks more than this percent
    # vs the previous cycle — silent source degradation is how ~1,400 names
    # went invisible before 2026-07-06.
    shrink_alert_pct: 10

    fmp_screener:
      enabled: true
      market_cap_more_than: 150000000   # $150M floor — below this, too illiquid
      # No volume floor: FMP volumeMoreThan filters on TODAY'S cumulative
      # intraday volume, so the universe size depended on what time the
      # cycle started (live 2026-07-09: 1,786 names at 9:57 ET vs ~3,500
      # by evening) — and averageVolumeMoreThan is silently ignored by
      # /stable/company-screener. Set > 0 only if FMP fixes the semantics.
      volume_more_than: 0
      price_more_than: 1                # skip sub-$1 husks
      limit: 10000
      exchanges: [NYSE, NASDAQ, AMEX]
      # FMP marks REIT trust structures isFund=true (FRT, RLJ — the Jul-09
      # hotfix quirk), so the isFund=false pull above excludes non-index
      # REITs. A second narrow pull (isFund=true + sector=Real Estate,
      # ~27 rows live) recovers them; mutual-fund share classes dropped by
      # symbol convention, residual fund-trusts blocked by the security-type
      # guard at first profile fetch.
      reit_trust_supplement: true

    # Universe hysteresis: keep recently-scanned high scorers in the scan
    # universe after every source drops them. Live holes this closes
    # (2026-07-15): HURC's cap flapping 0.2% under the screener's $150M
    # floor, and FMP marking TBRG isActivelyTrading=false while it trades
    # 300k shares/day (flag stuck since its 2024 rename). Self-limiting:
    # a retained name stays only while its score holds min_score — once it
    # decays, the row goes stale and ages out via max_age_days.
    stickiness:
      enabled: true
      min_score: 65        # retain names whose CANSLIM or growth score >= this
      max_age_days: 21     # ...scanned within this many days

  # Score-integrity telemetry: alert (log + webhook) when the share of
  # freshly-scanned stocks with c_score=0 jumps more than this many
  # percentage points cycle-over-cycle. C collapses to exactly 0 whenever
  # earnings data goes missing, so it's the canary for silent data wipes —
  # 424 stocks lost C-scores over two days before 2026-07-08 with nothing
  # alerting (single-component wipes stay under the save-path blip guard).
  integrity:
    c_wipe_alert_pct: 5
  workers: 8
  delay_min: 0.5  # seconds between API calls (min)
  delay_max: 1.0  # seconds between API calls (max)
  batch_size: 75  # Increased from 50 for better throughput
  max_retries: 2
  skip_fresh_stocks: true  # Skip stocks scanned within freshness_minutes
  freshness_minutes: 30  # Minimum age before re-scanning a stock

# Cache Settings
cache:
  # Redis cache
  redis:
    enabled: true
    host: localhost
    port: 6379
    db: 0
    decode_responses: true

  # Data freshness intervals (seconds)
  freshness_intervals:
    price: 0                # Always fetch (real-time)
    earnings: 86400         # 24 hours
    revenue: 86400          # 24 hours
    balance_sheet: 86400    # 24 hours
    key_metrics: 86400      # 24 hours
    analyst: 86400          # 24 hours
    earnings_surprise: 86400  # 24 hours
    weekly_history: 86400   # 24 hours
    institutional: 604800   # 7 days (1 week)
    insider_trading: 604800 # 7 days
    short_interest: 86400   # 24 hours

  # In-memory cache limits
  max_cached_tickers: 2500  # Need room for ~2100 tickers × ~10 data types
  market_cache_duration: 14400  # 4 hours

# CANSLIM Scoring Weights
scoring:
  canslim:
    max_scores:
      C: 15  # Current Quarterly Earnings
      A: 15  # Annual Earnings Growth
      N: 15  # New Highs
      S: 15  # Supply & Demand
      L: 15  # Leader vs Laggard
      I: 10  # Institutional Ownership
      M: 15  # Market Direction

    # C Score (Current Earnings) weights
    c_weights:
      base_max: 10          # TTM growth
      acceleration_max: 5   # EPS acceleration bonus (increased - strong predictor)
      surprise_max: 2       # Earnings surprise bonus

    # Sector-adjusted growth thresholds
    # A 20% growth for Industrial is excellent; for Tech it's mediocre
    sector_thresholds:
      Technology:
        excellent: 30
        good: 20
      Healthcare:
        excellent: 25
        good: 15
      Industrials:
        excellent: 20
        good: 12
      Utilities:
        excellent: 12
        good: 8
      default:
        excellent: 25
        good: 15

    # Institutional ownership thresholds (expanded from 20-60 to 25-75)
    institutional:
      ideal_min: 25
      ideal_max: 75
      partial_min: 15
      partial_max: 85

    # A Score (Annual Earnings) weights
    a_weights:
      cagr_max: 12         # 3-year CAGR
      roe_max: 3           # ROE quality bonus

    # Thresholds
    thresholds:
      min_score: 30        # Skip stocks below this score
      roe_excellent: 25    # ROE >= 25% = excellent
      roe_good: 17         # ROE >= 17% = good
      ttm_growth_excellent: 25  # >= 25% TTM growth = max score

  growth_mode:
    max_scores:
      R: 20  # Revenue Growth
      F: 15  # Funding/Financial Health
      N: 15  # New Highs
      S: 15  # Supply & Demand
      L: 15  # Leader vs Laggard
      I: 10  # Institutional Ownership
      M: 10  # Market Direction

    # Growth Mode activation criteria
    criteria:
      min_revenue_growth: 50  # >= 50% YoY = high growth
      min_profit_margin: 0.01 # < 1% margin = early stage

# Market Direction Settings
market:
  indexes:
    SPY:
      weight: 0.50  # S&P 500 - broad market
      name: "S&P 500"
    QQQ:
      weight: 0.30  # NASDAQ 100 - tech/growth
      name: "NASDAQ 100"
    DIA:
      weight: 0.20  # Dow Jones - blue chips
      name: "Dow Jones"

  # Signal scoring
  signals:
    strong_bullish: 2
    bullish: 1
    neutral: 0
    bearish: -1

# AI Trader Settings
ai_trader:
  # Chop damper — PROFILE-LEVEL research lever, default OFF everywhere.
  # Halves (position_multiplier) new-buy position sizes on days when SPY sits
  # 0..band_pct% above its 50MA (the "chop zone"; below-MA days are already
  # blocked by the binary gate). Motivation: live regime attribution
  # (2026-07-22, 73 trading days) — all outperformance came from strong-trend
  # days (+20.4pp vs SPY in 52d) while chop days cost −7.9pp in 20d. June's
  # backtested chop levers all failed (traded trend alpha for chop relief),
  # so this one is evaluated via LIVE SHADOW A/B only ('nostate_chop_damper'
  # stack); the champion profile never enables it. Set inside a strategy
  # profile as: chop_damper: {enabled: true, band_pct: 1.5, position_multiplier: 0.5}

  # Buy-candidate data hygiene
  buy_candidates:
    # Rows the scanner hasn't touched in this many hours are excluded from the
    # buy pool. Guards against universe churn leaving stale high-score rows
    # (frozen score/price/breakout flags) in the stocks table forever.
    max_staleness_hours: 48

  # Portfolio allocation limits
  allocation:
    min_cash_reserve_pct: 0.10    # Default cash reserve (overridden by dynamic regime-based reserves)
    # Dynamic cash reserves by market regime (replaces fixed 10%)
    cash_reserve_strong_bull: 0.05   # 5% — almost fully invested
    cash_reserve_bull: 0.10          # 10% — standard
    cash_reserve_neutral: 0.20       # 20% — uncertain market
    cash_reserve_bear: 0.40          # 40% — significantly reduced exposure
    cash_reserve_strong_bear: 0.60   # 60% — mostly cash, only pilot trades
    max_sector_allocation: 0.50   # Max 50% in any sector (O'Neil: follow best sectors, manage risk via stops)
    max_stocks_per_sector: 4      # Max 4 stocks per sector
    max_single_position: 0.25     # Max 25% in single stock (Minervini: 4 stocks at 25% = fully invested)
    min_position_pct: 1.5         # Skip buys below this % of portfolio value — runt positions
                                  # (e.g. a 0.6%-of-book cash remainder) pay full stop round trips
                                  # while moving nothing ($100 absolute floor still applies)
    min_score_to_buy: 72          # Minimum CANSLIM score to buy (raised from 65)
    # Soft buy threshold: stocks scoring just below min_score get graduated position sizes
    # instead of binary skip. Reduces sensitivity to FMP data variance on C/A scores.
    soft_threshold:
      enabled: true
      zone_width: 8              # Score 64-71 when min_score=72 (widened from 4 for FMP resilience)
      multiplier_at_edge: 0.25   # Score 64 → 25% position
      multiplier_at_top: 0.75    # Score 71 → 75% position
      # H: Only allow wide soft zone for stocks with strong deterministic scores
      require_strong_deterministic: true
      deterministic_min: 50      # N+S+L+I+M >= 50 (out of 70) to qualify for soft zone
    percentile_threshold_pct: 5   # Use top N% of stocks as adaptive threshold
    percentile_score_floor: 45    # Never buy below this score regardless of percentile

  # Stock selection quality filters - must meet ALL criteria
  quality_filters:
    min_c_score: 10               # Strong current earnings (max 15)
    min_l_score: 8                # Strong relative strength (max 15)
    min_volume_ratio: 1.2         # Accumulation signal (1.2x avg volume)
    skip_in_growth_mode: true     # Don't apply C/L filters to growth stocks

  # Earnings calendar avoidance for non-CS stocks
  # CS stocks use their own allow_buy_days from coiled_spring config
  earnings:
    avoidance_days: 5             # Block non-CS stocks within 5 days of earnings
    cs_override: true             # Allow CS stocks to override avoidance

  # Pre-earnings trailing stop tightening for HELD positions
  # Non-CS positions approaching earnings get tighter stops to protect gains
  # CS (Coiled Spring) positions are earnings plays — they hold through intentionally
  earnings_tighten:
    enabled: true
    days_before: 5                # Tighten stops within 5 days of earnings
    stop_tighten_factor: 0.50     # Use 50% of normal trailing stop (e.g., 25% -> 12.5%)
    min_gain_for_partial: 10      # Take 25% partial if up 10%+ near earnings

  # Earnings Audit: Deep FMP fundamental check for buy candidates
  # Runs between scan and AI trading to enrich composite scores
  earnings_audit:
    enabled: true
    max_candidates: 30              # Top N candidates to audit per cycle
    freshness_hours: 24             # Re-audit after this many hours
    weights:
      analyst_upside: 0.20          # 20pts: Analyst price target upside
      beat_quality: 0.25            # 25pts: Earnings beat streak + magnitude
      financial_health: 0.20        # 20pts: ROE, debt/equity, FCF
      insider_conviction: 0.15      # 15pts: Insider cluster buys + net value
      estimate_revisions: 0.20      # 20pts: EPS/revenue revision trend
    bonus_thresholds:
      high_confidence: 70           # >= 70 confidence → +10 composite
      high_bonus: 10
      medium_confidence: 50         # >= 50 confidence → +5 composite
      medium_bonus: 5
      low_confidence: 30            # < 30 confidence → -5 composite
      low_penalty: -5

  # Analyst revision bonus (estimate revisions)
  analyst_revisions:
    enabled: true
    strong_up_threshold: 10       # >= 10% revision = strong up
    strong_up_bonus: 5            # +5 points
    mod_up_bonus: 3               # 5-10% revision = +3 points
    strong_down_threshold: -10    # <= -10% revision = strong down
    strong_down_penalty: -5       # -5 points
    mod_down_penalty: -2          # -5 to -10% revision = -2 points

  # Market regime detection (adjusts position sizes based on market conditions)
  market_regime:
    enabled: true
    bullish_threshold: 1.5        # weighted_signal >= this = bullish
    bearish_threshold: -0.5       # weighted_signal <= this = bearish
    bullish_max_position_pct: 15.0  # Allow larger positions in bull market
    neutral_max_position_pct: 12.0  # Standard position sizing
    bearish_max_position_pct: 8.0   # Smaller positions in bear market
    bearish_min_score_adj: 10      # Require 10 more points in bear market (raised from 5)
    bear_exception_min_cal: 35     # Min C+A+L score to bypass bearish adjustment
    bear_exception_position_mult: 0.50  # 50% position size for bear market exceptions

  # Drawdown protection (reduce position sizes when portfolio is down)
  drawdown_protection:
    enabled: true
    level_1_threshold: 10         # >= 10% drawdown = reduce 25%
    level_1_multiplier: 0.75
    level_2_threshold: 15         # >= 15% drawdown = reduce 50%
    level_2_multiplier: 0.50

  # Sector rotation (bonus for leading sectors, penalty for lagging)
  sector_rotation:
    enabled: true
    leading_l_score: 10           # Avg L >= 10 = leading sector
    lagging_l_score: 5            # Avg L < 5 = lagging sector
    leading_bonus: 5              # +5 points for leading sectors
    lagging_penalty: -3           # -3 points for lagging sectors

  # Portfolio correlation (reduce position for concentrated sectors/industries)
  correlation:
    enabled: true
    sector_threshold: 3           # >= 3 stocks in sector = reduce position
    sector_multiplier: 0.85       # 15% smaller if same sector
    industry_threshold: 2         # >= 2 stocks in same industry = reduce more
    industry_multiplier: 0.70     # 30% smaller if same industry

  # Price correlation guard (30-day rolling price correlation with held positions)
  # Catches hidden concentration: stocks in different sectors can be 0.9 correlated
  correlation_guard:
    enabled: true
    threshold: 0.70               # Correlation level that triggers reduction
    reduction: 0.50               # Multiply position by 50% when above threshold
    lookback_days: 30             # Trading days for correlation window

  # Entry bonuses - pre-breakout is optimal entry (before the crowd)
  entry_bonuses:
    pre_breakout: 30     # 5-15% below pivot with base (best entry)
    at_pivot: 25         # 0-5% below pivot with base
    breakout: 20         # 0-5% above pivot (confirmed but slightly extended)

  # Position size multipliers based on entry type
  position_multipliers:
    pre_breakout: 1.30   # 30% larger for optimal pre-breakout entry
    at_pivot: 1.20       # 20% larger for at-pivot entries
    breakout: 1.15       # 15% larger for confirmed breakouts

  # Score crash sell requirements
  score_crash:
    consecutive_required: 3           # Legacy: 3+ consecutive low scans (still triggers sell)
    recent_low_required: 2            # NEW: 2 of last 3 scans low also triggers sell
    recent_low_window: 3              # Window size for recent_low check
    threshold: 50                     # Score must be below this threshold
    drop_required: 20                 # Score must have dropped by this much
    ignore_if_profitable_pct: 10      # Skip score crash sell if position is up this much %

  # Partial profit taking - lock in gains while letting winners run
  partial_profits:
    enabled: true
    threshold_25pct:
      gain_pct: 25         # Take partial at 25% gain
      sell_pct: 25         # Sell 25% of position
      min_score: 60        # Only if score still strong
    threshold_40pct:
      gain_pct: 40         # Take more at 40% gain
      sell_pct: 50         # Sell 50% total (25% additional)
      min_score: 60        # Only if score still strong
    threshold_50pct:
      gain_pct: 50         # Final tier at 50% gain
      sell_pct: 75         # Sell 75% total (25% additional)
      min_score: 55        # Slightly lower bar - protect big gains

  # Momentum confirmation
  momentum_confirmation:
    rs_ratio_threshold: 0.95  # rs_3m must be >= rs_12m * 0.95
    penalty: 0.15             # 15% penalty to composite score if fading

  # Re-entry cooldown (prevent same-day re-buys after stops)
  re_entry_cooldown:
    stop_loss_days: 5                 # Days to wait after stop loss before re-buying
    trailing_stop_days: 3             # Days to wait after trailing stop before re-buying

  # Drawdown protection (portfolio-level circuit breaker)
  drawdown_protection:
    halt_new_buys_pct: 15.0           # Stop buying when portfolio down 15% from peak
    liquidate_all_pct: 25.0           # Emergency: sell everything at 25% drawdown
    recovery_pct: 10.0                # Resume buying when drawdown recovers below 10%

  # Score stability: override soft-zone graduated sizing for stocks with strong
  # deterministic (non-FMP) scores (N+S+L+I+M = 70pts max).
  # When stable_score >= threshold, use multiplier_at_top regardless of total score.
  score_stability:
    enabled: true
    stable_min_for_override: 55   # Out of 70 max (N+S+L+I+M)

  # Market regime gate: LEGACY - replaced by market_state section below.
  # Kept for backward compatibility if market_state is disabled.
  market_regime_gate:
    enabled: true                    # Don't buy when SPY below 50-day MA

  # Conviction-based position sizing: higher scores get larger positions
  # Uses composite_score (typically 25-75 range, not CANSLIM 0-100)
  conviction_sizing:
    enabled: true                    # Re-enabled: data shift was the real cause, not sizing
    min_pct: 8.0                     # Floor: lowest-conviction positions
    max_pct: 20.0                    # Ceiling: highest-conviction positions
    score_floor: 30                  # Composite score at which min_pct applies
    score_ceiling: 75                # Composite score at which max_pct applies
    skip_initial_seeds: true         # G: Don't use conviction sizing for day-1 seed positions

  # New Position Guard: tighter stop loss for new positions in their first N days
  # Cuts early losers faster (POWL -22% in 14d, GDDY -14% in 7d)
  new_position_guard:
    enabled: true
    guard_days: 21                   # F: Apply tighter stop for first 21 days
    guard_stop_pct: 8.0              # F: 8% max loss for new positions (vs normal ATR-adjusted)
    skip_if_pyramided: true          # Don't apply guard if position has been pyramided (proven winner)

  # Aging Loser Guard: clamp the ATR-widened stop back down for stale positions
  # that never showed a real gain (thesis never worked). Backtester-only A/B
  # lever for the post-June-18 exit redesign — default OFF, opt in per sweep
  # arm via profile_overrides. Champion loser-tail evidence (backtests 756/733):
  # NFLX 207d -> -11.2%, VVV 78d -> -8.0%, GHC 56d -> -7.6%.
  #
  # VERDICT 2026-06-09 (NO-OP on nostate_optimized champion): a 5-window sweep
  # (4x 2-year windows 780-795 + full-cycle 2022-2026 runs 796-799) produced
  # ZERO binding events — champion paths' stale losers either recover past +5%
  # (then the 4% 5-10 trail manages them) or hit the ATR stop first. The
  # mined examples (NFLX 207d) did not recur under the fresh static snapshot.
  # Keep default-off as a research tool; nothing to mirror into ai_trader.py.
  aging_loser_guard:
    enabled: false
    min_holding_days: 45             # Only positions held at least this long
    max_peak_gain: 5.0               # Only if peak gain never reached this %
    clamp_stop_pct: 8.0              # Clamp stop to this (vs ATR-widened up to 20%)
    skip_if_pyramided: true          # Pyramided = proven conviction, leave alone

  # Profit Giveback Floor: once a position peaks past arm_at_peak_gain, exit if
  # it round-trips to floor_gain_pct — caps the giveback band where +10..28%
  # peaks exit near flat (TRMK +27.6% peak -> +6.7% realized, ACGL +12.3% ->
  # -3.7% in backtest 756). Backtester-only A/B lever — default OFF.
  #
  # VERDICT 2026-06-09 (UNPROVEN — do NOT ship): in daily-bar simulation the
  # floor almost always fires the same day as the trailing tier (pure relabel,
  # bit-identical results in all 4 short windows 780-795). Full-cycle run 798
  # showed +8.8pp vs control 796, but the paths are identical until a SINGLE
  # binding event (ACGL full-sell vs partial-trail, 2024-10-31) — n=1 path
  # fork, same evidence class as the killed June-1 "+47.8pp" standout. Binding
  # events are too rare (~2 per 4yr) to ever validate via backtest. Keep
  # default-off; only differentiated behavior is full-sell-vs-partial on
  # pyramided round-trippers and gap-throughs.
  profit_giveback_floor:
    enabled: false
    arm_at_peak_gain: 12.0           # Arm the floor once peak gain reaches this %
    floor_gain_pct: 1.0              # Exit if gain falls to/below this % after arming
    skip_if_pyramided: false         # Floor applies to pyramided positions too

  # Parity-fidelity levers (D4/D5, 2026-06-10): make the backtester model the
  # live trader's intraday behavior. Backtester-only, default OFF — champion
  # close-only behavior stays pinned; opt in per sweep arm via profile_overrides.
  # See docs/parity-audit-evaluate-sells.md.
  #
  # VERDICT 2026-06-10 (5/5 windows, runs 800-811): the cadence gap is FIRST-
  # ORDER. ctrl-vs-both deltas: full-cycle 22-26 +140.3%->+84.3% (-56pp),
  # 2018-20 -13.8pp, 2019-21 -16.5pp, 2020-22 -15.6pp, 2021-23 -8.2pp —
  # unanimous, with a consistent churn signature (trades +40..120%, Sharpe
  # collapses). Intraday peak watermark + intraday trail trigger together
  # shake winners out on ordinary daily ranges; close-only backtests model a
  # calmer trader than the live ~90min loop actually is. D5 alone was +17pp
  # (41 binding events, n-small); D4 alone return-neutral but churn-heavy.
  # NOTE: D4+D5 assumes worst-case intra-day ordering (high raises peak
  # before low is checked), so it is the PESSIMISTIC bound; live sits inside
  # the bracket. Implication for June-19: evaluating live trailing stops once
  # daily near the close (the control arm's behavior) is the highest-leverage
  # live-side exit candidate ever measured here.
  # ORDERING BRACKET + LIVE VALIDATION 2026-06-10 (runs 812-816, use_prior_peak
  # = optimistic ordering): 8/8 window arms below control under BOTH orderings
  # (drag −1..−17pp per 2yr window) — but the full-cycle optimistic arm BEAT
  # control (+175.8 vs +140.3), so single-path 4yr numbers are fork-dominated;
  # quote the per-window drag, NOT −56pp. Live trade log (n=27 sells) confirms
  # the signature harder than any model: trailing exits 9.2d hold / 50% WR /
  # −0.1% avg vs 81d / 76% / +3.6% in the control. See
  # docs/parity-audit-evaluate-sells.md D5 verdict blocks.
  # D4: live raises peak_price from intraday prices every ~90min cycle, so the
  # live peak watermark is systematically >= the backtest's close-only peak and
  # live trailing stops fire earlier than backtests model. Track the backtest
  # peak from the daily HIGH instead, mirroring live.
  peak_from_daily_highs:
    enabled: false
  # D5: live checks stops intraday every scan; close-only checks miss breaches
  # that recover by close. Trigger stop-family exits when the daily LOW breached
  # the level, fill at the stop level (or the open on gap-throughs) — the
  # pessimistic bound that brackets live cadence against close-only (optimistic).
  stop_on_daily_low:
    enabled: false
    include_trailing: true           # Also trigger trailing stops on the low
    use_prior_peak: false            # false: low vs today's peak (high-then-low,
                                     # pessimistic). true: low vs yesterday's peak
                                     # (low-then-high, optimistic). Live is between.
  # D2: live score-crash stability reads the last 3 ~90min scans
  # (check_score_stability lookback=3), so "3 consecutive low" confirms in
  # ~4.5 hours and blip protection spans one afternoon — the backtester
  # appends ONE score per trading day, so the same gates take 3 trading days.
  # Model the live clock by appending each day's score scans_per_day times:
  # one low day fills the consecutive/2-of-3 windows same-day, like live.
  # Approximation: live intraday scores wobble around the daily value; the
  # lever replicates the single daily score. Pessimistic for blips that live
  # would catch mid-recovery, faithful for genuine one-day crashes.
  # MEASURED 2026-06-11 (runs 817-826): low-impact, sign-mixed — deltas
  # −3.7 / 0.0 / +0.5 / +10.4pp across the four 2-yr windows with only 1-7
  # binding crash sells each; full-cycle −14.1pp is fork-dominated (same D5
  # caveat). The fast live clock is NOT a measurable systematic drag; the
  # June-19 per-day dedup is parity hygiene, not a return lever. See
  # docs/parity-audit-evaluate-sells.md D2.
  score_crash_scan_clock:
    enabled: false
    scans_per_day: 4                 # ~6.5h market day / 90min scan cadence

  # Backtest delist liquidation (Jul-2 audit C): the data provider's
  # get_price_on_date falls back to the most recent prior close, so a
  # delisted/halted ticker "holds" flat at its last print forever — it never
  # triggers a stop and hogs one of max_positions slots for the rest of the
  # run. Force-sell at the last known close after max_stale_days consecutive
  # trading days with no fresh bar. Default ON: this is data correctness, not
  # a strategy lever. Backtest-only — live delisting is handled by the
  # DelistedTicker pipeline and the broker.
  delist_liquidation:
    enabled: true
    max_stale_days: 10               # ~2 calendar weeks; halts are shorter, delistings aren't

  # Deterministic score boost: bonus to composite for stocks with strong
  # non-FMP scores (N+S+L+I+M). Reduces FMP influence on ranking/sizing.
  deterministic_boost:
    enabled: true
    stable_bonus_threshold: 55   # N+S+L+I+M >= 55 → +5 to composite
    stable_bonus: 5
    strong_threshold: 60         # N+S+L+I+M >= 60 → +8 to composite
    strong_bonus: 8

  # Entry extension guard: block buys when price is too far above the 50MA at entry.
  # Complements the pivot-relative extended_penalty, which misses late-stage bases whose
  # pivot already sits far above the 50MA. Default OFF — opt in per strategy profile via
  # profile_overrides (extension_guard.enabled).
  #
  # VERDICT 2026-06-09 (KILLED on nostate_optimized champion): a 4-window A/B sweep
  # (control vs caps 30/25/20) found NO robust edge. Caps 25-30 were no-ops (the champion's
  # composite ranking + 8-position cap already keeps >25%-extended names out of the executed
  # portfolio); cap 20 DESTROYED value (full-cycle return 173.6%->150.3%, worse drawdown)
  # because the champion's winners include healthy momentum leaders sitting 20-30% above the
  # 50MA. A blunt 50MA hard-cap is the wrong altitude for this strategy. NOT mirrored to
  # ai_trader.py. Kept default-off as a research tool for future non-champion strategies
  # (e.g. growth mode) where the broad-population leak may still be real. Don't re-pursue on
  # the champion without a fundamentally different formulation. Diagnostic that motivated it:
  # entries >30% above the 50MA had median outcome ~-10% across ALL historical backtests.
  extension_guard:
    enabled: false
    max_pct_above_50ma: 30           # skip new entries priced more than this % above the 50MA

  # Stop loss settings
  stops:
    normal_stop_loss_pct: 8.0          # O'Neil: cut losses at 7-8%, no exceptions
    bearish_stop_loss_pct: 7.0        # Tighter in bear (Minervini: tighter stops in difficult markets)
    use_atr_stops: true               # Use ATR-based adaptive stop losses
    atr_multiplier: 2.5               # Stop = max(config_stop, ATR * multiplier)
    atr_period: 14                    # ATR lookback period in days
    max_stop_pct: 20.0                # Maximum stop loss percentage (cap)

  # Trailing stop loss thresholds
  trailing_stops:
    gain_50_plus:
      threshold: 0.50    # 50%+ gain
      stop_pct: 0.15     # 15% trailing stop
    gain_30_to_50:
      threshold: 0.30
      stop_pct: 0.12     # 12% trailing stop
    gain_20_to_30:
      threshold: 0.20
      stop_pct: 0.10     # 10% trailing stop
    gain_10_to_20:
      threshold: 0.10
      stop_pct: 0.08     # 8% trailing stop
    gain_5_to_10:
      threshold: 0.05
      stop_pct: 0.04     # 4% trailing stop — protect micro-winners
    # Partial sell on trailing stop for high-conviction positions
    partial_on_trailing: true           # Enable partial sell on trailing stop hit
    partial_min_pyramid_count: 2        # Min pyramids to qualify for partial
    partial_min_score: 65               # Min score to qualify for partial
    partial_sell_pct: 50                # Sell this % of position, keep remainder

  # Trailing-stop cadence (June-19 exit-parity item 2). When daily_only is true,
  # LIVE trailing stops fire only in the close window (once/day) — matching the
  # backtester's daily cadence and cutting intraday churn. Hard stops (stop-loss,
  # score-crash) stay intraday. Default OFF (no behavior change); flip June 19.
  # Consumed by trading_engine.trailing_stops_allowed_now().
  trailing_cadence:
    daily_only: false                   # Base default OFF (keeps dev/test trailing-trigger tests time-independent); ENABLED for live in config/production.yaml (2026-06-18)
    window_start_hour_et: 15            # 15:00 ET = final hour before close; the ~15:30 ET scan lands here
    window_start_minute_et: 0
    market_close_hour_et: 16

  # Insider trading signal weights
  insider_signals:
    bullish_bonus: 5      # +5 points for bullish insiders
    bearish_penalty: -3   # -3 points for bearish insiders
    buy_sell_ratio: 1.5   # Buys > 1.5x sells = bullish
    # Insider cluster detection (multiple insiders buying)
    cluster_bonus: 8               # Bonus for 3+ insider buys
    high_value_cluster_bonus: 12   # Bonus for 3+ buys totaling $1M+
    csuite_bonus: 3                # Extra bonus for C-suite buying

  # Short interest settings
  short_interest:
    high_threshold: 0.20  # > 20% short interest
    high_penalty: -5
    medium_threshold: 0.10  # > 10% short interest
    medium_penalty: -2

  # Short squeeze detection
  # High short interest can be opportunity with right setup
  short_squeeze:
    enabled: true
    min_short_pct: 20             # Min short interest to consider squeeze
    min_l_score: 10               # Must have strong relative strength
    squeeze_bonus: 5              # Bonus for squeeze setup (instead of penalty)

# Market State Machine: graduated exposure system (replaces binary regime gate)
# In bull markets (SPY > 50MA), state is TRENDING at 100% — identical to old regime gate.
# The new states only activate during/after corrections, providing structured re-entry.
market_state:
  enabled: true

  # Exposure limits per state (fraction of portfolio)
  exposure_limits:
    trending: 1.00      # Full exposure — bull market default
    pressure: 0.60      # Distribution accumulating
    correction: 0.00    # No new buys — protect capital
    recovery: 0.30      # FTD confirmed — cautious re-entry
    confirmed: 0.55     # Recovery validated — normal buying

  # Follow-Through Day detection thresholds
  ftd:
    min_gain_pct: 1.7       # Stricter than O'Neil's 1.25%
    earliest_day: 4         # Day 4 of rally attempt (O'Neil standard)
    latest_day: 25          # Max days to wait for FTD

  # Distribution day tracking
  distribution:
    min_decline_pct: -0.2       # Minimum decline to count
    expiry_calendar_days: 35    # ~25 trading days
    rally_off_pct: 6.0          # % rally removes a distribution day
    pressure_threshold: 5       # Count that triggers PRESSURE

  # State transition thresholds
  transitions:
    correction_below_ma50_pct: 0.0  # Below 50MA to enter CORRECTION from PRESSURE
    trending_deep_drop_pct: 3.0     # % below 50MA for direct TRENDING → CORRECTION
    pressure_below_21ema_days: 3    # Days below 21EMA + below 50MA = PRESSURE
    recovery_confirm_days: 3        # Days above 21EMA: RECOVERY → CONFIRMED
    trending_confirm_days: 5        # Days above 21EMA: CONFIRMED → TRENDING
    trending_max_dist_days: 3       # Max dist days to re-enter TRENDING
    min_correction_days: 3          # Min days in CORRECTION before allowing fast-track exit
    min_confirmed_days: 3           # Min days in CONFIRMED before allowing back to CORRECTION

  # Recovery seeding (when portfolio is depleted after a correction)
  recovery_seed:
    enabled: true
    min_score: 45       # Lower than normal (72) — crash depresses all scores
    max_positions: 3    # Match normal seed count for diversification
    max_exposure_pct: 50  # Match normal max_seed_investment_pct
    seed_pct: 12        # Slightly larger per-position (vs normal 10%)
    min_l_score: 6      # Lower than normal (8) — RS meaningless after crash

# Coiled Spring / Earnings Catalyst Detection
# Identifies stocks with explosive earnings potential based on:
# - Long consolidation (stored energy)
# - Consistent earnings beats
# - Low institutional ownership (room to buy)
# - Rising relative strength
coiled_spring:
  # ALL criteria must be met to qualify
  thresholds:
    min_weeks_in_base: 15       # Long consolidation = stored energy
    min_beat_streak: 3          # Consistent execution
    min_c_score: 10             # Strong current earnings (relaxed from 12)
    min_total_score: 55         # Quality stock
    max_institutional_pct: 75   # Room for institutions to buy (relaxed from 50)
    min_l_score: 6              # Rising relative strength (relaxed from 8)

  # Relaxed thresholds for PRE-BREAKOUT candidates (haven't had catalyst yet)
  pre_breakout_thresholds:
    min_c_score: 5              # Lower C requirement (catalyst hasn't happened)
    min_total_score: 48         # Lower total (will improve after earnings)
    min_beat_streak: 3          # Same consistency requirement

  # Earnings timing
  earnings_window:
    alert_days: 14              # Start tracking 14 days out
    allow_buy_days: 7           # Allow buys up to 7 days before (override 3-day block)
    block_days: 1               # Never buy within 1 day of earnings

  # Scoring bonus
  scoring:
    base_bonus: 20              # Base bonus when criteria met
    long_base_bonus: 10         # Extra for 20+ week base
    strong_beat_bonus: 5        # Extra for 5+ consecutive beats
    max_bonus: 35               # Cap total CS bonus

  # Quality ranking weights (used to rank candidates, higher = better)
  ranking_weights:
    weeks_in_base: 1.5          # Longer base = more stored energy
    beat_streak: 3.0            # Consistency is key
    l_score: 2.0                # Relative strength momentum
    total_score: 0.5            # Overall quality
    low_inst_bonus: 10          # Bonus if inst < 30% (room to run)
    pre_breakout_bonus: 15      # Bonus if NOT already breaking out (ideal entry)
    extended_penalty: -20       # Penalty if already extended (>5% above pivot with high volume)

  # Alert settings (prevent overload)
  alerts:
    enabled: true
    max_per_day: 5              # Maximum alerts per day (increased from 3)
    cooldown_hours: 8           # Hours between alerts for same ticker
    include_in_email: true
    min_price_change_pct: 3     # Require 3% price move from previous alert to re-alert same ticker

  # Confidence gating (rule-based scoring 0-100 from historical outcomes)
  # LOW (0-29): death zone, skip. MODERATE (30-59): caution. HIGH (60+): act.
  min_confidence: 30            # Skip CS override for LOW confidence setups

  # Position sizing
  position_multiplier: 1.25     # 25% larger position for CS plays

  # Outcome tracking (auto-update CS alert outcomes after earnings)
  outcome_tracking:
    enabled: true
    check_days_after_earnings: 3   # Days to wait after earnings to check outcome
    thresholds:
      big_win_pct: 15    # >= 15% gain = big_win
      win_pct: 3         # >= 3% gain = win (lowered from 5% — 3-5% post-earnings is still a solid signal)
      loss_pct: -5       # <= -5% = loss
      # Between -5% and +3% = flat

# Watchlist Alerts
watchlist:
  alerts:
    enabled: true
    check_after_scan: true       # Check alerts after each scan completes
    cooldown_hours: 24           # Don't re-alert for same item within 24h

# Technical Analysis Settings
technical:
  # Base pattern detection
  base_patterns:
    flat_base:
      min_weeks: 5
      max_range_pct: 0.15  # < 15% weekly range
    cup_with_handle:
      min_decline_pct: 0.15  # >= 15% decline
      handle_min_pct: 0.05   # 5-15% handle pullback
      handle_max_pct: 0.15
      handle_max_weeks: 4
    double_bottom:
      min_recovery_pct: 0.10  # >= 10% recovery between lows
      low_tolerance_pct: 0.03 # Lows within 3% of each other

  # Breakout detection
  breakout:
    volume_threshold: 1.5     # 1.5x average volume
    pivot_proximity_pct: 0.05  # Within 5% of pivot
    confirmation_score: 60     # Min volume confirmation score

# Stock Universe Settings
universe:
  sources:
    - sp500        # S&P 500
    - sp400        # S&P MidCap 400
    - sp600        # S&P SmallCap 600
    - russell2000  # Russell 2000

  # Duplicate ticker handling
  duplicates:
    GOOG: GOOGL  # Keep GOOGL, filter GOOG

# API Rate Limits
api:
  # Ranked list endpoints (/api/stocks, /api/stocks/breaking-out) hide rows
  # the scanner hasn't updated in this many hours — universe churn leaves
  # frozen scores that would otherwise rank forever. Search is unaffected.
  stale_row_max_hours: 72

  fmp:
    rate_limit: 300          # FMP plan limit (calls per minute)
    target_rate: 250         # Our target (leave headroom)
    burst_size: 10           # Max burst before throttling
    timeout: 10              # seconds per request
    failure_threshold: 5     # consecutive 429s to trip circuit breaker
    base_cooldown: 30        # seconds initial cooldown when tripped
    max_cooldown: 300        # seconds max cooldown (5 min)
    backoff_base: 2.0        # seconds base for exponential backoff
    backoff_max: 60.0        # seconds max backoff
    max_retries: 3           # retries per request on 429
  yahoo:
    delay: 0.3       # seconds between calls
    timeout: 15      # seconds
  finviz:
    delay: 1.0       # seconds between scrapes
    timeout: 10      # seconds

# API Response Limits
api_limits:
  default_page_size: 50
  max_page_size: 500
  default_history_days: 30
  max_history_days: 365

# Scoring Defaults
scoring_defaults:
  min_displayable_score: 30
  default_market_score: 10

# Retry Settings
retry:
  max_attempts: 3
  base_delay_seconds: 1
  max_delay_seconds: 30

# Alert Thresholds
alerts:
  price_change_significant_pct: 5
  volume_spike_ratio: 2.0

# Notifications
notifications:
  # Webhook notifications (push notifications via ntfy.sh, Pushover, etc.)
  webhook:
    enabled: true
    # Set CANSLIM_WEBHOOK_URL environment variable to enable
    # Example: https://ntfy.sh/your-topic
    url_env_var: "CANSLIM_WEBHOOK_URL"
    priority: "high"             # Priority for CS alerts

  # Weekly performance email (sent Saturday 9 AM)
  weekly_email:
    enabled: true
    day_of_week: "sat"           # Day to send (mon, tue, wed, thu, fri, sat, sun)
    hour: 9                      # Hour to send (0-23)

# Database Settings
database:
  # Indexes for optimization
  indexes:
    - name: ix_stocks_canslim
      column: canslim_score
    - name: ix_stocks_price
      column: current_price
    - name: ix_stocks_score_price
      columns: [canslim_score, current_price]

# Market Timing (O'Neil's system: A/D days + Follow-Through Days)
market_timing:
  # Accumulation/Distribution Day Tracking
  accumulation_distribution:
    enabled: true
    lookback_days: 25                  # Rolling window for A/D day count
    distribution_threshold: 4          # 4-5 distribution days in 25 = go defensive
    critical_threshold: 5              # 5+ distribution days = go to cash
    # A distribution day: index down 0.2%+ on higher volume than prior day
    min_decline_pct: 0.2               # Minimum decline for distribution day
    # An accumulation day: index up 0.2%+ on higher volume than prior day
    min_advance_pct: 0.2               # Minimum advance for accumulation day

  # ============================================================
  # DISABLED FEATURES — Backtested in runs #42-#46. All filtering
  # and blocking features hurt returns in bullish markets. Only
  # additive score bonuses (RS line +8, earnings drift +5/+3) were
  # net-positive. Keep disabled unless re-validated in bear market.
  # ============================================================

  # Follow-Through Day Confirmation (O'Neil market timing)
  follow_through_day:
    enabled: false
    penalty: 8                         # Score penalty when FTD not confirmed (default 8)
    min_rally_day: 4                   # FTD must occur on day 4+ of rally attempt
    min_gain_pct: 1.5                  # Index must gain 1.5%+ on FTD
    require_higher_volume: true        # Volume must be higher than prior day
    # State machine: CONFIRMED_UPTREND -> UPTREND_UNDER_PRESSURE -> MARKET_IN_CORRECTION -> RALLY_ATTEMPT
    states:
      confirmed_uptrend: "CONFIRMED_UPTREND"
      under_pressure: "UPTREND_UNDER_PRESSURE"
      correction: "MARKET_IN_CORRECTION"
      rally_attempt: "RALLY_ATTEMPT"

# RS Line New Highs (relative strength line making new highs before price)
rs_line:
  enabled: false
  lookback_weeks: 52                   # 52-week lookback for RS line new high
  bonus_points: 8                      # Bonus when RS line hits new high before price
  penalty_divergence: -5               # Penalty when price at new high but RS line isn't

# Earnings Surprise Drift (post-earnings momentum)
earnings_drift:
  enabled: false
  min_surprise_pct: 10                 # Minimum earnings beat to trigger drift signal
  drift_window_days: 60                # How long drift effect lasts after earnings
  bonus_points: 5                      # Score bonus for stocks in drift window
  volume_confirmation: true            # Require above-average volume on earnings day

# Portfolio Heat Monitor (total risk exposure)
portfolio_heat:
  enabled: false
  max_heat_pct: 15.0                   # Block new buys if total heat > 15%
  warning_heat_pct: 12.0               # Log warning at 12%
  # Heat = sum of (position_size_pct × distance_to_stop_pct)

# VIX-Regime Stops (volatility-adjusted stop losses)
vix_stops:
  enabled: false
  low_vix_threshold: 15                # VIX < 15: low volatility
  high_vix_threshold: 25               # VIX > 25: high volatility
  low_vix_stop_tighten: 0.80           # Tighten stops 20% in low vol (multiply by 0.8)
  high_vix_stop_widen: 1.20            # Widen stops 20% in high vol (multiply by 1.2)

# Volume Confirmation on Entry
# Context-aware thresholds replace the flat quality_filters.min_volume_ratio (1.2).
# When disabled, code falls back to that flat 1.2 threshold which incorrectly
# rejects pre-breakout candidates whose quiet volume IS the accumulation signal.
volume_gate:
  enabled: true
  min_volume_ratio: 0.8                # Normal entries: volume >= 80% of 50-day average
  breakout_min_volume_ratio: 1.2       # Breakout entries need 1.2x (daily close underestimates intraday)
  pre_breakout_min_volume_ratio: 0.6   # Pre-breakout: low volume = accumulation/dry-up signal

# Correlation-Aware Sizing
correlation_sizing:
  enabled: false
  lookback_days: 30                    # Rolling correlation window
  high_correlation_threshold: 0.70     # Reduce sizing when avg correlation > 0.7
  high_correlation_multiplier: 0.75    # 25% smaller position when correlated
  max_correlated_positions: 3          # Max positions with correlation > threshold

# Scale-In on Pullbacks (add to winners pulling back)
scale_in_pullbacks:
  enabled: false
  min_gain_pct: 10.0                   # Position must be up 10%+ to qualify
  pullback_pct: 3.0                    # Pullback of 3-5% from recent high
  max_pullback_pct: 5.0                # Don't add if pulled back more than 5%
  low_volume_ratio: 0.8                # Pullback should be on below-average volume
  add_pct: 30.0                        # Add 30% of original position size
  min_score: 70                        # Score must still be strong

# Intraday Breakout Monitor — DB-backed dedup + daily cap (May 2026)
# Pre-fix, the monitor's cooldown lived in a Python module-level dict that
# got wiped on every container redeploy, producing repeat alerts per ticker.
# Now BreakoutAlert rows back the cooldown + cap, so they survive restart.
breakout_monitor:
  daily_cap: 10                        # Max breakout alerts per day (cluster spam guard)

# Trade Journal / Performance Attribution
trade_journal:
  enabled: true
  track_signal_factors: true           # Record which factors drove each trade
  # Factors tracked: entry_type (pre-breakout, breakout, etc.), market_regime,
  # A/D count, FTD state, RS line new high, insider signal, sector momentum,
  # coiled spring, earnings drift

# Backtester Settings
backtester:
  workers: 12                         # Number of parallel workers for fetching price history
  use_frozen_scores: true             # MUST stay true: BacktestStaticSnapshot freezes today's point-in-time scalars (earnings_surprise_pct, eps_estimate_revision_pct, eps_beat_streak, roe, institutional_holders_pct) and applies them to ALL historical replay dates. The earnings ARRAYS get date-filtered correctly, but the SCALARS don't — fresh-compute (Layer 4) would score 2022 stocks using 2026 metadata, which is semantically wrong. We learned this May 6-7 2026: flipped to false to evaluate Approach 2, baseline returned -15% (vs +136.84% under frozen). The frozen StockScore rows are correct because the live scanner wrote them at each scan date with then-current data. Approach 2 (and any canslim_scorer change) must be evaluated via live A/B, NOT via backtest replay. See canslim_scorer-refactor-may6.md memory note.
  disk_cache:
    enabled: true                     # Enable disk caching for price history
    database: null                    # Path to cache database (null = default: data/price_cache.db)
    expiry_days: 30                   # Days before cached data expires

# Strategy Profiles — preset trading configurations
# Used by both backtester and live AI trader
strategy_profiles:
  balanced:
    label: "Balanced (Default)"
    description: "Standard CANSLIM with ride-winners sell discipline"
    min_score: 72
    max_positions: 8
    max_single_position_pct: 25
    max_sector_pct: 50
    stop_loss_pct: 8.0
    bearish_stop_loss_pct: 7.0
    take_profit_pct: 75.0                 # Let winners run (was 40) — proven in #90
    trailing_stops:
      gain_50_plus: 20                    # Wider for big winners (was 15) — proven in #90
      gain_30_to_50: 15                   # Wider (was 12) — give room for consolidation
      gain_20_to_30: 10
      gain_10_to_20: 8
      gain_5_to_10: 4                     # Protect micro-winners from bleeding to stop loss
    seed_count: 3                            # Ralph Loop optimized: 3 is optimal (tested 2-5)
    seed_pct: 10
    max_seed_investment_pct: 50            # Ralph Loop optimized: 50% is optimal (was 60)
    quality_filters:
      min_c_score: 10
      min_l_score: 8
    scoring_weights:
      growth_projection: 0.20             # Reduced from 0.25 (less FMP-heavy component)
      canslim_score: 0.25
      momentum: 0.25                      # Increased from 0.20 (more price-based component)
      breakout: 0.20
      base_quality: 0.10
    # Ride-winners sell discipline — don't shake out profitable positions
    score_crash_drop_required: 25         # Require bigger score drop before selling (was 20)
    score_crash_ignore_if_profitable: 20  # Hold if up 20%+ through score dips (was 10%)

  growth:
    label: "Growth Mode"
    description: "Growth-focused ranking + ride winners as long as thesis holds"
    min_score: 68                       # Still lower than balanced (72) to catch emerging growth
    max_positions: 6                    # Concentrated — fewer, higher-conviction bets
    max_single_position_pct: 25         # Match balanced — avoid single-stock blow-ups
    max_sector_pct: 50                  # Match balanced
    stop_loss_pct: 8.0                  # Match balanced — cut losers fast
    bearish_stop_loss_pct: 7.0          # Match balanced — tighter in bear
    take_profit_pct: 75.0               # Let big winners ride (was 55, balanced 40)
    trailing_stops:
      gain_50_plus: 20                  # Wider — growth stocks swing more (balanced: 15)
      gain_30_to_50: 15                 # Wider — give room for consolidation (balanced: 12)
      gain_20_to_30: 10                 # Match balanced
      gain_10_to_20: 8                  # Match balanced
      gain_5_to_10: 4                   # Protect micro-winners
    seed_count: 4                       # Fewer seeds — more selective on day 1
    seed_pct: 10                        # Match balanced per-seed size
    max_seed_investment_pct: 50          # E: Max 50% of capital in initial seeds (growth is more selective)
    quality_filters:
      min_c_score: 12                   # Higher C bar — demand strong earnings
      min_l_score: 10                   # Higher L bar — demand relative strength leaders
    scoring_weights:
      growth_projection: 0.35           # Heavier growth tilt (vs 0.25 balanced)
      canslim_score: 0.20
      momentum: 0.25                    # Heavier momentum tilt (vs 0.20 balanced)
      breakout: 0.15
      base_quality: 0.05
    # Growth mode ranking bonuses — these are the key differentiator
    c_score_weight: 1.3                 # Weight C score 30% more (earnings momentum)
    l_score_weight: 1.3                 # Weight L score 30% more (relative strength)
    n_score_weight: 1.2                 # Weight N score 20% more (new highs)
    eps_accel_bonus: 8                  # Extra bonus for EPS acceleration (vs 5 in balanced)
    pre_breakout_multiplier: 1.40       # Slightly larger pre-breakout positions (balanced: 1.30)
    # "Ride the thesis" — more lenient score-based sells for growth
    score_crash_drop_required: 25       # Require bigger score drop before selling (balanced: 20)
    score_crash_ignore_if_profitable: 20  # Hold if up 20%+ even on score dip (balanced: 10%)

  # Lab profile: Clone of balanced for optimization experiments
  # SAFETY: NEVER modify balanced or growth profiles via automated optimization.
  # Only this lab profile should be changed by optimization scripts.
  lab:
    label: "Lab (Lean Market State)"
    description: "Relaxed exposure limits: hold through pullbacks, faster re-deployment. No experimental features."
    min_score: 72
    max_positions: 8
    max_single_position_pct: 25
    max_sector_pct: 50
    stop_loss_pct: 7.0
    bearish_stop_loss_pct: 6.0
    take_profit_pct: 75.0
    trailing_stops:
      gain_50_plus: 20
      gain_30_to_50: 15
      gain_20_to_30: 10
      gain_10_to_20: 8
      gain_5_to_10: 4
    seed_count: 3
    seed_pct: 10

    max_seed_investment_pct: 50
    quality_filters:
      min_c_score: 10
      min_l_score: 8
    scoring_weights:
      growth_projection: 0.20
      canslim_score: 0.25
      momentum: 0.25
      breakout: 0.20
      base_quality: 0.10
    score_crash_drop_required: 25
    score_crash_ignore_if_profitable: 20

    # Lean market state: hold through pullbacks, faster re-deployment
    # Key change: PRESSURE 60% → 85% (stop over-selling on normal dips)
    # CONFIRMED 55% → 70% (deploy faster after FTD confirmation)
    market_state:
      exposure_limits:
        trending: 1.00
