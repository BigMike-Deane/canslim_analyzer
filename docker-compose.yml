version: '3.8'

services:
  canslim:
    build:
      context: .
      args:
        VITE_API_TOKEN: ${API_TOKEN:-}
    container_name: canslim-analyzer
    ports:
      - "100.104.189.36:8001:8001"  # Tailscale-only direct access
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - backtest-cache:/tmp/backtest_cache
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # NOTE: this block uses LIST syntax (- KEY=VAL). The postgres service
    # below uses MAP syntax (KEY: VAL). Don't append entries to one block
    # via a sed pattern that also matches the other — the shapes are not
    # interchangeable and YAML parsing will break.
    environment:
      - DEBUG=false
      - FMP_API_KEY=${FMP_API_KEY}
      - CANSLIM_ENV=production
      - DATABASE_URL=postgresql://canslim:${POSTGRES_PASSWORD}@postgres:5432/canslim
      - CANSLIM_WEBHOOK_URL=${CANSLIM_WEBHOOK_URL:-}
      - API_TOKEN=${API_TOKEN:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@canslim.local}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Leak hunt (2026-09-09), staged in the Sep-8 OOM work. glibc malloc
      # opens up to 8 x ncores arenas, one per thread on demand; memory
      # freed in one arena is neither returned to the OS nor reusable by
      # another, so ~4k HTTP fetches/scan across threads accrete per-arena
      # free lists that read exactly like a slow leak. Capping arenas
      # forces reuse. CONTROL (build 75a6087, no cap, 2026-09-08 23:53 ->
      # 2026-09-09 13:44): RSS 694 MB @1.0h -> 1050 MB @12.9h; marginal
      # rate plateaued at ~23.6 MB/h over the last 4.5h, matching the
      # ~23 MB/h of the run that OOM-killed. Compare the next run's slope:
      # slope drops => fragmentation, job done; slope holds => a TRUE leak
      # and the suspects are the weekly-history cache (096e73d), async
      # fetch buffers and the shadow 12-stack rebuild per cycle.
      # Runtime stage is Debian glibc 2.41, so this knob is live (musl
      # would silently ignore it).
      - MALLOC_ARENA_MAX=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # Memory ceiling (2026-09-08): uvicorn leaked to 2.87 GB and the kernel
    # OOM-killed it host-wide (postgres was an eligible victim). A cgroup
    # limit makes the kernel kill THIS container only and stamps OOMKilled
    # in `docker inspect`. backend/process_health.py alerts at 1800 MB,
    # well before this line. Host is 3.7 GB, no swap.
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: canslim-postgres
    ports:
      - "100.104.189.36:5432:5432"  # Tailscale-only access for MCP/dev tools
    # NOTE: postgres uses MAP syntax (KEY: VAL) — see canslim service note.
    environment:
      POSTGRES_DB: canslim
      POSTGRES_USER: canslim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canslim"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: canslim-redis
    # NOTE: Port intentionally NOT exposed to host for security
    # The canslim service connects via Docker internal network using hostname 'redis'
    # If you need local dev access, run Redis natively or use: ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: canslim-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - canslim
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Observability (2026-09-09). Added because the Sep-8 uvicorn OOM ran for
  # 91h unnoticed, and because process_health.py's in-Redis RSS samples are
  # wiped by every redeploy -- so measuring a leak RATE meant restarting the
  # clock on each deploy. These containers live OUTSIDE canslim, so the
  # series survives redeploys.
  #
  # Deploy them WITHOUT touching the app:
  #     docker-compose up -d cadvisor prometheus grafana
  # (naming the services means canslim is not recreated).
  #
  # Every service is mem_limit-capped ON PURPOSE: this is a 3806 MB host and
  # canslim alone may legitimately reach its 2560m cap. Monitoring must never
  # be what pushes the box into the host-wide OOM it exists to prevent.
  # Prometheus and Grafana bind to the Tailscale IP only, same as postgres.
  # ---------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: canslim-cadvisor
    # No published port: only prometheus talks to it, over the compose network.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    command:
      # Trim collection to what the alerts actually use -- cAdvisor is the
      # memory-hungry part of this stack if left at defaults.
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl'
    mem_limit: 192m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: canslim-prometheus
    ports:
      - "100.104.189.36:9090:9090"  # Tailscale-only
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 30d is plenty to read a leak slope, and the size cap protects the
      # 16 GB of free disk on this box.
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
    depends_on:
      - cadvisor
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: canslim-grafana
    ports:
      - "100.104.189.36:3000:3000"  # Tailscale-only
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env. Tailscale-bound, but do not ship
      # the admin/admin default.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme-set-in-env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backtest-cache:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
