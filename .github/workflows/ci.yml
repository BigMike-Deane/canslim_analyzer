# CI for CANSLIM Analyzer.
#
# Added 2026-09-09. Until now the repo had NO automated checks at all: every
# verification was somebody running pytest by hand and remembering to look at
# the result. Three number-consistency bugs shipped to production that day,
# and the regression tests written for them only help if something actually
# runs them.
#
# Deliberately modest: the full suite plus a frontend build. No deploy step --
# deploys stay manual and owner-driven.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # Root requirements.txt is the dev/test set (it carries pytest and the
        # empyrical cross-check). backend/requirements.txt is what the Docker
        # image installs -- both are needed for the suite to run as it does
        # locally. See TestTheDependencyShipsInTheImage for why that split
        # matters.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        # REQUIRED, not cosmetic. backend/main.py only registers the SPA
        # catch-all route ("/{full_path:path}") when frontend/dist exists, and
        # slowapi resolves its default-limit bucket from the matched route
        # handler. Without dist, undecorated API routes get NO default rate
        # limit, and test_default_limit_is_sixty_per_minute fails -- which is
        # exactly what happened on 2026-09-09. More importantly, without this
        # step CI exercises a DIFFERENT route table than production, so every
        # other test is measuring the wrong app too.
        run: |
          npm ci
          npm run build

      - name: Run tests
        env:
          REQUIRE_AUTH: 'false'
          CANSLIM_ENV: development
          DISABLE_SCHEDULER: 'true'
        # Coverage reporting is configured in pytest.ini; disable it here so a
        # coverage hiccup can never be the reason CI reports a failure.
        run: python -m pytest tests/ -q --no-cov

  frontend:
    name: vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        # A broken JSX edit currently only surfaces at deploy time, when the
        # Docker build runs vite. Catch it here instead.
        run: |
          npm ci
          npm run build

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Install frontend deps and browser
        working-directory: frontend
        # --with-deps needs root, which the runner has (local dev does not --
        # see frontend/e2e/README.md for the LD_LIBRARY_PATH workaround).
        #
        # Retried because --with-deps shells out to apt, and the runner image
        # carries Google's Chrome repo as a source. On 2026-09-09 that repo
        # was mid-sync (release file 17:16, index 09:41) and apt aborted with
        # "Hash Sum mismatch" -> exit 100, failing a job whose code was fine.
        # A transient upstream mirror should not page the owner.
        run: |
          npm ci
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright browser install failed (attempt $attempt/3); retrying"
            sleep 20
          done
          echo "::error::playwright browser install failed after 3 attempts"
          exit 1

      - name: Run e2e
        working-directory: frontend
        # `npm run e2e` builds the frontend first; the backend serves
        # frontend/dist itself, so one uvicorn provides API and UI. The suite
        # seeds its own throwaway SQLite book -- it never touches production.
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
